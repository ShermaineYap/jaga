# NVIDIA OpenShell sandbox policy for Jaga — REAL schema (OpenShell 0.1.4,
# docs/how-it-works/policies/schema.mdx in NVIDIA/OpenShell). Accepted by a
# running 0.1.4 gateway (Docker driver) on 2026-10-16; evidence in
# hermes/OPENSHELL_RUN.md.
#
# Default-deny is implicit: there is no "defaultAction" key. Any
# (binary, host:port) pair not listed is refused by the sandbox egress proxy.
# Unknown keys are a hard error.
#
# Keys: NEBIUS_API_KEY / TAVILY_API_KEY are NOT put in the sandbox. They live in
# gateway-side providers (jaga-nebius-token-factory, jaga-tavily) whose profiles
# bind them to exactly these hosts; the sandbox only sees
# `openshell:resolve:env:...` placeholders, which the proxy swaps for the real
# bearer token on the wire (needs protocol: rest = TLS termination + L7).
#
# Applied by hermes/setup_nemohermes.sh via the Python SDK (no CLI was
# available). With the CLI it would be:
#   openshell sandbox create --from jaga-sandbox:local --policy hermes/openshell-policy.yaml \
#     --provider jaga-nebius-token-factory --provider jaga-tavily -- sleep infinity
#   (CLI form untested.)
version: 1

filesystem_policy:
  include_workdir: true          # /sandbox
  read_only: [/usr, /lib, /lib64, /etc, /opt, /bin, /sbin, /proc, /dev/urandom]
  read_write: [/sandbox, /data, /tmp, /dev/null]   # /data holds jaga.sqlite3

landlock:
  compatibility: best_effort

process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies:
  nebius_token_factory:          # NVIDIA Nemotron inference on Nebius Token Factory
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
    binaries: &jaga_bins
      - path: /usr/bin/python3.12
      - path: /usr/bin/curl      # only for the smoke test in OPENSHELL_RUN.md
  tavily:                        # verification against official alert lists
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
    binaries: *jaga_bins
  telegram:                      # senior + guardian messaging
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
    binaries: *jaga_bins
