# NVIDIA OpenShell sandbox policy for Jaga — REAL schema (OpenShell 0.1.4,
# docs/how-it-works/policies/schema.mdx). Validated by a running gateway on
# 2026-10-16; see hermes/OPENSHELL_RUN.md for the exact run and evidence.
#
# Default-deny: any (binary, host:port) pair not listed below is refused by
# the sandbox's egress proxy. There is no "defaultAction" key — deny is
# implicit. Unknown keys are a hard error.
#
# With the CLI:  openshell sandbox create --from jaga-sandbox:local \
#                  --policy hermes/openshell-policy.yaml -- <cmd>
# Without the CLI (what we did): hermes/openshell_run.py loads this file and
# maps it onto the SandboxPolicy protobuf for the Python SDK.
version: 1

filesystem_policy:
  include_workdir: true          # /sandbox
  read_only: [/usr, /lib, /lib64, /etc, /opt, /bin, /sbin, /proc, /dev/urandom]
  read_write: [/sandbox, /data, /tmp, /dev/null]   # /data holds jaga.sqlite3

landlock:
  compatibility: best_effort

process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies:
  nebius_token_factory:          # NVIDIA Nemotron inference on Nebius Token Factory
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
        tls: skip
    binaries: &jaga_bins
      - path: /usr/bin/python3.12
      - path: /usr/bin/curl      # only for the smoke test in OPENSHELL_RUN.md
  tavily:                        # verification against official alert lists
    endpoints:
      - host: api.tavily.com
        port: 443
        tls: skip
    binaries: *jaga_bins
  telegram:                      # senior + guardian messaging
    endpoints:
      - host: api.telegram.org
        port: 443
        tls: skip
    binaries: *jaga_bins
